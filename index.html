<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E6EBE4; --ink:#1D2A27; --muted:#5B6A65; --line:#D3DBD4;
  --accent:#2F6F5E; --accent-ink:#FFFFFF; --accent-soft:#D6E7DF;
  --urge:#A9650F; --urge-ink:#FFFFFF; --urge-soft:#F3E4C9; --danger:#A63D3D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111816; --surface:#19221F; --sunk:#212C29; --ink:#E4ECE8; --muted:#9AAAA4; --line:#2E3B37;
    --accent:#76BBA5; --accent-ink:#0E1614; --accent-soft:#1E362F;
    --urge:#E2A54C; --urge-ink:#1A1206; --urge-soft:#3A2C16; --danger:#E58585;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --sunk:#212C29; --ink:#E4ECE8; --muted:#9AAAA4; --line:#2E3B37;
  --accent:#76BBA5; --accent-ink:#0E1614; --accent-soft:#1E362F;
  --urge:#E2A54C; --urge-ink:#1A1206; --urge-soft:#3A2C16; --danger:#E58585;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:16px 20px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
h2{font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:14px}
section.block{margin-top:30px}

/* Today hero */
.hero{padding:20px 0 6px}
.date{margin:0;color:var(--muted);font-size:15px}
.streak{margin:4px 0 2px;font-size:clamp(44px,13vw,68px);line-height:1;font-weight:700;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.streak .unit{font-size:.42em;font-weight:500;letter-spacing:-.01em;margin-left:.2em;color:var(--muted)}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.urge-btn{display:block;width:100%;margin-top:22px;border:0;border-radius:22px;background:var(--urge);color:var(--urge-ink);padding:22px 20px;font-size:22px;font-weight:700;letter-spacing:-.01em;text-align:left;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.urge-btn span{display:block;font-size:15px;font-weight:400;opacity:.92;margin-top:2px}
.urge-btn::after{content:"";position:absolute;right:22px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:3px solid currentColor;opacity:.85}
.urge-btn:active{transform:translateY(1px)}

.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.habit{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:52px}
.habit .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.habit[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent}
.habit[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.habit[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.plan{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.plan li{padding:11px 0;border-bottom:1px solid var(--line)}
.textlink{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* Chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{margin-top:22px}
.field > label,.field > .lbl{display:block;font-weight:600;margin-bottom:8px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--urge)}
.range-row{display:flex;align-items:baseline;justify-content:space-between}
.range-val{font-size:28px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:50px}
.btn.wide{width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.urge{background:var(--urge);color:var(--urge-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn-row .btn{flex:1 1 160px}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);display:none;z-index:40}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom,0px));z-index:41;display:none;max-width:620px;margin:0 auto}
.sheet.open{display:block;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.open{animation:none}.progress i{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h3{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.sheet-head p{margin:6px 0 0;color:var(--muted)}

/* Timer */
.timer{display:grid;place-items:center;margin:26px 0 8px;position:relative}
.timer svg{width:220px;height:220px;transform:rotate(-90deg)}
.timer .t-txt{position:absolute;text-align:center}
.timer .t-num{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.breath{text-align:center;font-size:20px;font-weight:600;min-height:32px;margin:6px 0 4px}

/* Log */
.day-group{margin-top:24px}
.day-group h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 8px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.entry-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk)}
.badge.ok{background:var(--accent-soft);color:var(--ink)}
.badge.slip{background:var(--urge-soft);color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.entry-note{margin:8px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.entry-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;font-size:14px}

/* Patterns */
.insight{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--urge);border-radius:12px;padding:14px 16px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.hours{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:6px}
.hours i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.hours i.peak{background:var(--urge);opacity:1}
.hour-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.bars .row{display:grid;grid-template-columns:minmax(110px,40%) 1fr 28px;gap:10px;align-items:center;margin-bottom:8px;font-size:15px}
.bars .track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bars .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.grid-scroll{overflow-x:auto}
table.hgrid{border-collapse:collapse;font-size:13px}
table.hgrid th{font-weight:500;color:var(--muted);padding:2px 3px;text-align:center}
table.hgrid th.rowh{text-align:left;white-space:nowrap;padding-right:10px;color:var(--ink)}
table.hgrid td{padding:2px}
table.hgrid td i{display:block;width:16px;height:16px;border-radius:5px;background:var(--sunk)}
table.hgrid td i.on{background:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}

/* Lock */
.vault-pw{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:clamp(22px,6vw,30px);letter-spacing:.06em;background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:18px;text-align:center;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.sealed{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
.seal-icon{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.seal-icon svg{width:26px;height:26px;stroke:var(--accent)}
.countdown{font-size:42px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0}
ol.steps{padding-left:22px;margin:12px 0 0}
ol.steps li{margin-bottom:6px}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.edit-list{list-style:none;margin:0;padding:0}
.edit-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1}
.add-row .btn{min-height:46px;padding:10px 16px}
.sync{font-size:13px;color:var(--muted)}
input[type=time]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;font-size:16px;min-width:108px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.install{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin-top:16px;font-size:15px}
.install b{display:block;font-size:16px;margin-bottom:2px}
.install .textlink{padding:4px 0 0}
.rem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rem-row label{display:flex;gap:10px;align-items:center;flex:1;font-size:16px}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:90%;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Steady<small id="syncNote">Stays on your phone</small></div>
    <button class="icon-btn" data-act="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Log</button>
  <button data-tab="patterns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></svg>Patterns</button>
  <button data-tab="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock</button>
</div></nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const DAY = 864e5;
const clone = x => JSON.parse(JSON.stringify(x));
const DEFAULT_HABITS = [
  {id:"fajr",name:"Fajr"},{id:"dhuhr",name:"Dhuhr"},{id:"asr",name:"Asr"},{id:"maghrib",name:"Maghrib"},{id:"isha",name:"Isha"},
  {id:"workout",name:"Workout"},{id:"deep",name:"Deep work block"},{id:"read",name:"Reading"}
];
const DEFAULT_PLAN = [
  "Stand up and leave the room",
  "Make wudu and pray two rak’ahs",
  "20 push-ups or a fast walk outside",
  "Message or call a friend",
  "Put the phone in another room"
];
const FEELINGS = ["Hungry","Angry","Lonely","Tired","Bored","Stressed","Sad","Anxious","Rejected","Restless"];
const PLACES = ["In bed","Bathroom","At my desk","Living room","Outside"];
const BEFORE = ["Scrolling social media","Avoiding work or study","Alone late at night","Just woke up","After an argument","Saw something triggering","Nothing in particular"];
const BREATH = ["Breathe in… 4","Hold… 4","Breathe out slowly… 6"];
const TIMER_MIN = 15;

const DEFAULT_REMINDERS = [
  {id:"morning",name:"Morning intention",time:"07:30",on:true,body:"Set one goal for today and pick your deep work block."},
  {id:"deep",name:"Deep work block",time:"10:00",on:true,body:"Phone in another room. 45 minutes on one thing."},
  {id:"workout",name:"Workout",time:"17:30",on:true,body:"Even 15 minutes counts. Go now."},
  {id:"read",name:"Reading instead of scrolling",time:"21:30",on:true,body:"10 pages. Phone charging outside the bedroom."},
  {id:"risk",name:"Risky-hour check-in",time:"22:30",on:true,body:"Your hardest window is starting. Open Steady and plan the next hour."}
];
function fresh(){ return {v:1,start:Date.now(),habits:DEFAULT_HABITS.map(h=>({...h})),plan:DEFAULT_PLAN.slice(),entries:[],days:{},reminders:clone(DEFAULT_REMINDERS),hideInstall:false}; }
function normalize(o){
  const f = fresh();
  if(!o || typeof o!=="object") return f;
  return {
    v:1,
    start: typeof o.start==="number" ? o.start : f.start,
    habits: Array.isArray(o.habits) ? o.habits : f.habits,
    plan: Array.isArray(o.plan) ? o.plan : f.plan,
    entries: Array.isArray(o.entries) ? o.entries : [],
    days: (o.days && typeof o.days==="object") ? o.days : {},
    reminders: Array.isArray(o.reminders) ? o.reminders : f.reminders,
    hideInstall: !!o.hideInstall
  };
}

/* ---------- storage ---------- */
const LS_S="steady:state", LS_V="steady:vault";
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let S = normalize(lsGet(LS_S));
let V = lsGet(LS_V) || null;
const db=null;
function saveState(){ lsSet(LS_S,S); }
function saveVault(){ lsSet(LS_V,V); }
function askPersist(){ try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dkey(t){ const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function startOfDay(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function fmtTime(t){ return new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
function fmtDay(t){
  const k=dkey(t);
  if(k===dkey(Date.now())) return "Today";
  if(k===dkey(Date.now()-DAY)) return "Yesterday";
  return new Date(t).toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"});
}
function fmtHour(h){ const ap=h<12?"am":"pm"; const x=h%12===0?12:h%12; return x+" "+ap; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2800); }
function uidGen(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function isStandalone(){ return navigator.standalone===true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }
function notifState(){
  if(!("Notification" in window)) return (isIOS && !isStandalone()) ? "install" : "unsupported";
  return Notification.permission;
}
function notify(title, body){
  if(notifState()!=="granted") return;
  const opts={body, icon:"icon-192.png", badge:"icon-192.png", tag:"steady"};
  let done=false;
  const fallback=()=>{ if(done) return; done=true; try{ new Notification(title,opts); }catch(e){} };
  if("serviceWorker" in navigator && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(r=>{ done=true; return r.showNotification(title,opts); }).catch(fallback);
    setTimeout(fallback,1500);
  } else fallback();
}
async function saveFile(name, text, type, preferShare){
  const blob=new Blob([text],{type});
  if(preferShare){
    try{
      const f=new File([blob],name,{type});
      if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return true; }
    }catch(e){ if(e && e.name==="AbortError") return false; }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return true;
}
function peakStart(){
  if(S.entries.length<3) return null;
  const hours=new Array(24).fill(0); S.entries.forEach(e=>hours[new Date(e.ts).getHours()]++);
  let best=0,sum=-1; for(let h=0;h<24;h++){ const s=hours[h]+hours[(h+1)%24]+hours[(h+2)%24]; if(s>sum){sum=s;best=h;} }
  return best;
}
const scramble = s => btoa(unescape(encodeURIComponent(s.split("").reverse().join(""))));
const unscramble = s => decodeURIComponent(escape(atob(s))).split("").reverse().join("");

function slipTimes(){ return S.entries.filter(e=>e.outcome==="slipped").map(e=>e.ts).sort((a,b)=>a-b); }
function streakInfo(){
  const sl=slipTimes();
  const last = sl.length ? sl[sl.length-1] : S.start;
  const cur = Math.max(0,Math.floor((Date.now()-last)/DAY));
  let best=cur, prev=S.start;
  for(const t of sl){ best=Math.max(best,Math.floor((t-prev)/DAY)); prev=t; }
  const slipDays=new Set(sl.map(dkey));
  let clean=0, tracked=0;
  const first=startOfDay(S.start);
  for(let i=0;i<30;i++){
    const t=Date.now()-i*DAY;
    if(startOfDay(t)<first) break;
    tracked++; if(!slipDays.has(dkey(t))) clean++;
  }
  return {cur,best,clean,tracked};
}

function countBy(arr){ const m={}; arr.forEach(x=>{ if(x) m[x]=(m[x]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }

function viewPatterns(){
  const E=S.entries;
  let out=`<h2 style="margin-top:14px">Patterns</h2>`;
  if(E.length<3){
    out+=`<div class="empty">Log at least 3 urges and your patterns will show up here: the hours you’re most at risk, the feelings that come first, and what you were doing right before.<br><br>${E.length} of 3 logged.</div>`;
    return out+habitGrid();
  }
  const resolved=E.filter(e=>e.outcome!=="pending");
  const resisted=E.filter(e=>e.outcome==="resisted").length;
  const rate=resolved.length?Math.round(resisted/resolved.length*100):0;
  const ints=E.filter(e=>e.intensity).map(e=>e.intensity);
  const avg=ints.length?(ints.reduce((a,b)=>a+b,0)/ints.length).toFixed(1):"–";
  const hours=new Array(24).fill(0);
  E.forEach(e=>hours[new Date(e.ts).getHours()]++);
  let bestStart=0,bestSum=-1;
  for(let h=0;h<24;h++){ const s=hours[h]+hours[(h+1)%24]+hours[(h+2)%24]; if(s>bestSum){bestSum=s;bestStart=h;} }
  const peakSet=new Set([bestStart,(bestStart+1)%24,(bestStart+2)%24]);
  const maxH=Math.max(...hours,1);
  const feelings=countBy(E.flatMap(e=>e.feelings||[]));

  let sentence=`Your riskiest window is ${fmtHour(bestStart)} to ${fmtHour((bestStart+3)%24)}`;
  if(feelings.length) sentence+=`, most often when you feel ${feelings.slice(0,2).map(f=>f[0].toLowerCase()).join(" and ")}`;
  if(befores.length && befores[0][0]!=="Nothing in particular") sentence+=`, usually after “${befores[0][0].toLowerCase()}”`;
  if(places.length) sentence+=`, and mostly ${places[0][0].toLowerCase()}`;

  if(st==="install") return `<p class="muted small" style="margin:0">Add Steady to your Home Screen first (Share, then “Add to Home Screen”), open it from there, and turn notifications on here. Needs iOS 16.4 or later.</p>`;
  if(st==="unsupported") return `<p class="muted small" style="margin:0">This browser doesn’t support notifications. On iPhone, update to iOS 16.4 or later and open Steady from your Home Screen.</p>`;
  if(st==="granted") return `<p class="small" style="margin:0 0 10px">On. Steady notifies you when your urge timer finishes.</p><button class="btn ghost" data-act="testNotif">Send a test notification</button>`;
  if(st==="denied") return `<p class="muted small" style="margin:0">Blocked. Turn them on in iPhone Settings, then Notifications, then Steady.</p>`;
  return `<button class="btn" data-act="notif">Turn on notifications</button>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async ev=>{
  const tb=ev.target.closest("nav.tabs button"); if(tb){ setTab(tb.dataset.tab); return; }
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="urge") urgeForm("urge");
  else if(a==="slip") urgeForm("slip");
  else if(a==="close"){ closeSheet(); render(); }
  else if(a==="settings") settingsSheet();
  else if(a==="habit"){
    const k=dkey(Date.now()); const arr=S.days[k]=S.days[k]||[]; const id=el.dataset.id;
    const i=arr.indexOf(id); if(i>=0) arr.splice(i,1); else arr.push(id);
    saveState(); render();
  }
  else if(a==="chip" && el.closest(".chips")){
    const g=el.closest(".chips"); const key=g.dataset.group; const multi=g.dataset.multi==="1"; const val=el.dataset.val;
    if(g.closest("#sheet") && draft){
      if(multi){ const arr=draft[key]; const i=arr.indexOf(val); if(i>=0) arr.splice(i,1); else arr.push(val); el.setAttribute("aria-pressed", i<0); }
      else { draft[key]= draft[key]===val ? "" : val; g.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.val===draft[key])); }
    }
  }
  else if(a==="startTimer"){ const e=saveDraft("pending"); timerSheet(e); }
  else if(a==="saveSlip"){ saveDraft("slipped"); closeSheet(); render(); toast("Logged. Check Patterns to see what led here."); }
  else if(a==="resolve"){
    const e=S.entries.find(x=>timer && x.id===timer.entryId);
    if(e){ e.outcome=el.dataset.val; saveState(); }
    closeSheet(); render();
    toast(el.dataset.val==="resisted"?"Well done. That’s one more rep for your brain.":"Logged. Start again now, not tomorrow.");
  }
  else if(a==="outcome"){ const e=S.entries.find(x=>x.id===el.dataset.id); if(e){ e.outcome=el.dataset.val; saveState(); render(); } }
  else if(a==="delEntry"){
    const ok=await ask("Delete this entry?","It will be removed from your log and patterns.","Delete",true);
    closeSheet(); if(ok){ S.entries=S.entries.filter(x=>x.id!==el.dataset.id); saveState(); } render();
  }
  else if(a==="askok"){
    if(el.dataset.typed){ const v=($("#typed")||{}).value||""; if(v.trim().toLowerCase()!==el.dataset.typed.toLowerCase()){ toast("Type the sentence exactly to continue."); return; } }
    const r=askResolve; askResolve=null; if(r) r(true);
  }
  else if(a==="askno"){ const r=askResolve; askResolve=null; if(r) r(false); closeSheet(); render(); }
  else if(a==="addHabit"){ const v=($("#newHabit").value||"").trim(); if(v){ S.habits.push({id:"h"+uidGen(),name:v}); saveState(); settingsSheet(); render(); } }
  else if(a==="delHabit"){ S.habits=S.habits.filter(h=>h.id!==el.dataset.id); saveState(); settingsSheet(); render(); }
  else if(a==="addPlan"){ const v=($("#newPlan").value||"").trim(); if(v){ S.plan.push(v); saveState(); settingsSheet(); render(); } }
  else if(a==="delPlan"){ S.plan.splice(+el.dataset.i,1); saveState(); settingsSheet(); render(); }
  else if(a==="wipe"){
    const ok=await ask("Erase all tracking data?","Your log, habits history and streak will be reset. Your sealed password is not affected.","Erase everything",true);
    closeSheet(); if(ok){ const keep={habits:S.habits,plan:S.plan}; S=fresh(); S.habits=keep.habits; S.plan=keep.plan; saveState(); toast("Tracking data erased."); } render();
  }
  else if(a==="hideInstall"){ S.hideInstall=true; saveState(); render(); }
  else if(a==="notif"){
    try{ const r=await Notification.requestPermission(); if(r==="granted"){ notify("Notifications are on","Steady will nudge you when your urge timer is done."); } }catch(e){}
    settingsSheet();
  }
  else if(a==="testNotif"){ notify("Steady","This is how your reminders will look."); toast("Sent. Lock your phone to check it arrives."); }
  else if(a==="ics"){
    const on=S.reminders.filter(r=>r.on);
    if(!on.length){ toast("Turn on at least one reminder first."); return; }
    const d=new Date(); const ymd=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
    const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
    const ie=s=>String(s).replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
    const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Steady//Reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Steady"];
    for(const r of on){
      const [hh,mm]=r.time.split(":");
      L.push("BEGIN:VEVENT","UID:steady-"+r.id+"-"+stamp+"@steady","DTSTAMP:"+stamp,"DTSTART:"+ymd+"T"+hh+mm+"00","DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:Steady: "+ie(r.name),"DESCRIPTION:"+ie(r.body||""),
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+ie(r.name),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
    }
    L.push("END:VCALENDAR");
    await saveFile("steady-reminders.ics", L.join("\r\n"), "text/calendar", false);
    toast("Tap “Add All” when Calendar asks.");
  }
  else if(a==="export"){
    const data={app:"steady",version:1,exportedAt:new Date().toISOString(),state:S,vault:V?{...V,pw:undefined,pwx:scramble(V.pw)}:null};
    const ok=await saveFile("steady-backup-"+dkey(Date.now())+".json", JSON.stringify(data,null,1), "application/json", true);
    if(ok){ S.lastBackup=Date.now(); saveState(); toast("Backup ready. Choose “Save to Files.”"); }
  }
  else if(a==="import"){ $("#importFile").click(); }
  else if(a==="vformat"){ vFormat=el.dataset.val; render(); }
  else if(a==="vdelay"){ vDelay=+el.dataset.val; render(); }
  else if(a==="vgen"){ V={format:vFormat,pw:FORMATS[vFormat].gen(),delayH:vDelay,sealedAt:null,requestAt:null}; saveVault(); render(); }
  else if(a==="vcopy"){
    const pw=V&&V.pw; if(!pw) return;
    try{ await navigator.clipboard.writeText(pw); toast("Copied. Paste it into your blocker now."); }
    catch(e){ const r=document.createRange(); r.selectNodeContents($("#pw")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Copy it from your keyboard menu."); }
  }
  else if(a==="vseal"){
    const ok=await ask("Seal the password?","Make sure it’s already set as your blocker or Screen Time password. After sealing, you’ll have to wait "+V.delayH+" hours to see it again.","Seal it",false);
    closeSheet(); if(ok){ V.sealedAt=Date.now(); V.requestAt=null; saveVault(); toast("Sealed."); } render();
  }
  else if(a==="vdiscard"){ V=null; saveVault(); render(); }
  else if(a==="vrequest"){
    const ok=await ask("Start the "+V.delayH+"-hour wait?","The countdown starts now. You can cancel at any point and the password stays sealed.","Start the wait",false,"I choose to wait");
    closeSheet(); if(ok){ V.requestAt=Date.now(); saveVault(); } render();
  }
  else if(a==="vcancel"){ V.requestAt=null; saveVault(); render(); toast("Kept sealed. Good call."); }
  else if(a==="vreseal"){ V.sealedAt=Date.now(); V.requestAt=null; saveVault(); render(); toast("Sealed again."); }
  else if(a==="vclear"){
    const ok=await ask("Clear the vault?","The password will be deleted from Steady and can’t be recovered here.","Clear vault",true);
    closeSheet(); if(ok){ V=null; saveVault(); } render();
  }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.rem){ const r=S.reminders.find(x=>x.id===t.dataset.rem); if(r){ r.on=t.checked; saveState(); } }
  else if(t.dataset && t.dataset.remtime){ const r=S.reminders.find(x=>x.id===t.dataset.remtime); if(r && /^\d{2}:\d{2}$/.test(t.value)){ r.time=t.value; saveState(); } }
  else if(t.id==="importFile" && t.files && t.files[0]){
    let data=null;
    try{ data=JSON.parse(await t.files[0].text()); }catch(e){}
    if(!data || data.app!=="steady" || !data.state){ toast("That file isn’t a Steady backup."); return; }
    const when=data.exportedAt?new Date(data.exportedAt).toLocaleDateString():"an unknown date";
    const ok=await ask("Restore this backup?","It’s from "+when+" and will replace everything currently in Steady.","Restore",false);
    closeSheet();
    if(ok){
      S=normalize(data.state); saveState();
      if(data.vault){ const v={...data.vault}; try{ v.pw=v.pwx?unscramble(v.pwx):v.pw; }catch(e){} delete v.pwx; V=v.pw?v:null; } else V=null;
      saveVault(); toast("Backup restored.");
    }
    render();
  }
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="intensity" && draft){ draft.intensity=+ev.target.value; $("#ival").textContent=ev.target.value; }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape" && $("#sheet").classList.contains("open")){ if(askResolve){ const r=askResolve; askResolve=null; r(false); } closeSheet(); render(); }
  if(ev.key==="Enter" && (ev.target.id==="newHabit"||ev.target.id==="newPlan")){ ev.preventDefault(); const b=ev.target.parentElement.querySelector("button"); if(b) b.click(); }
});
$("#overlay").addEventListener("click", ()=>{ if(askResolve){ const r=askResolve; askResolve=null; r(false); } closeSheet(); render(); });

/* ---------- ticker ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function tick(){
  if(timer && $("#tnum")){
    const left=Math.max(0,timer.end-Date.now());
    const m=Math.floor(left/60e3), s=Math.floor(left%60e3/1e3);
    $("#tnum").textContent=m+":"+pad(s);
    const frac=left/(TIMER_MIN*60e3);
    const ring=$("#ring"); if(ring) ring.setAttribute("stroke-dashoffset",(603.2*(1-frac)).toFixed(1));
    const el=Math.floor((Date.now()-timer.start)/1000)%14;
    const b=$("#breath"); if(b) b.textContent= el<4?BREATH[0]: el<8?BREATH[1]:BREATH[2];
    if(left===0 && !timer.notified){ timer.notified=true; notify("You rode it out","The urge timer is done. Open Steady and log how it went."); }
    if(left===0){ $("#tnum").textContent="Done"; if(b) b.textContent="The wave has passed. How did it go?"; }
  }
  const cd=$("#cd");
  if(cd && V && V.requestAt){
    const left=V.requestAt+V.delayH*3600e3-Date.now();
    if(left<=0){ render(); return; }
    const h=Math.floor(left/3600e3), m=Math.floor(left%3600e3/60e3), s=Math.floor(left%60e3/1e3);
    cd.textContent=h+":"+pad(m)+":"+pad(s);
  }
}
setInterval(tick,1000);

render();
askPersist();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw",e)));
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(); });
})();
</script>
